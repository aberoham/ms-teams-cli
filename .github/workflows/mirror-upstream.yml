name: Mirror upstream release

# Builds each stable osodevops/ms-teams-cli release from upstream's own tagged
# commit, checked out from upstream's repository, and publishes it here as
# upstream-vX.Y.Z: signed and notarized for macOS, with provenance
# attestations and an attested source manifest, for the tap's teams-cli
# formula. The fork's own work ships separately as vX.Y.Z-alpha.N.
#
# Schedules run only from the default branch, which is next, and release.yml
# refuses a mirror from anywhere else. Signing waits for approval of the
# release environment, as a tag release does.

on:
  schedule:
    # Weekdays, half an hour before the tap's teams-cli updater.
    - cron: "47 8 * * 1-5"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to mirror, vX.Y.Z (default is the oldest unmirrored recent release)
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

env:
  UPSTREAM: osodevops/ms-teams-cli

jobs:
  find:
    name: Find an unmirrored upstream release
    if: github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.choose.outputs.build }}
      source_ref: ${{ steps.choose.outputs.source_ref }}
      release_tag: ${{ steps.choose.outputs.release_tag }}
      version_tag: ${{ steps.choose.outputs.version_tag }}
    steps:
      - name: Choose the release
        id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Prints "missing" or "published" for this repository's mirror of
          # an upstream tag. Anything else, including a lookup that fails for
          # a reason other than 404, a draft, a release without all its
          # assets, or a tag without a release, stops the run for a person to
          # look at rather than being skipped or overwritten.
          mirror_state() {
            local tag="$1" release="upstream-$1" out
            if ! out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release}" 2>&1)"; then
              if ! grep -q 'HTTP 404' <<<"$out"; then
                echo "Could not look up ${release}: ${out}" >&2
                return 1
              fi
              if out="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release}" 2>&1)"; then
                echo "Tag ${release} exists without a release; delete it and run again" >&2
                return 1
              elif ! grep -q 'HTTP 404' <<<"$out"; then
                echo "Could not look up tag ${release}: ${out}" >&2
                return 1
              fi
              echo missing
              return 0
            fi
            # Five archives, the source manifest and the checksums, each
            # fully uploaded and not empty.
            local expected missing
            expected="$(printf '%s\n' \
              "teams-${tag}-aarch64-apple-darwin.tar.gz" \
              "teams-${tag}-x86_64-apple-darwin.tar.gz" \
              "teams-${tag}-aarch64-unknown-linux-musl.tar.gz" \
              "teams-${tag}-x86_64-unknown-linux-musl.tar.gz" \
              "teams-${tag}-x86_64-pc-windows-msvc.zip" \
              "teams-${tag}-source.txt" \
              checksums-sha256.txt)"
            missing="$(jq -r --arg expected "$expected" '
              ($expected | split("\n")) - [.assets[] | select(.state == "uploaded" and .size > 0) | .name]
              | join(" ")' <<<"$out")"
            if [[ "$(jq -r .draft <<<"$out")" != false || -n "$missing" ]]; then
              echo "${release} is a draft or lacks complete assets (${missing:-none missing}); finish or delete it" >&2
              return 1
            fi
            echo published
          }

          if [[ -n "$REQUESTED_TAG" ]]; then
            candidates=("$REQUESTED_TAG")
          else
            # Oldest first among upstream's 20 most recent stable releases, so
            # two releases between runs are both mirrored. An older omission
            # needs a run by hand with its tag. The list is captured in an
            # assignment so that a failed lookup stops the run.
            listed="$(gh release list --repo "$UPSTREAM" \
              --exclude-drafts --exclude-pre-releases --limit 20 \
              --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | .[].tagName')"
            mapfile -t candidates <<<"$listed"
          fi

          tag=""
          for candidate in "${candidates[@]}"; do
            [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            state="$(mirror_state "$candidate")"
            if [[ "$state" == missing ]]; then
              tag="$candidate"
              break
            fi
          done
          if [[ -n "$REQUESTED_TAG" && -z "$tag" ]]; then
            echo "Upstream ${REQUESTED_TAG} is not a stable tag, or is already mirrored" >&2
            exit 1
          fi
          if [[ -z "$tag" ]]; then
            echo "Every recent stable upstream release is mirrored; nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          state="$(gh release view "$tag" --repo "$UPSTREAM" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [[ "$state" != "false false" ]]; then
            echo "Upstream ${tag} is a draft or a prerelease (${state}); not mirroring it" >&2
            exit 1
          fi
          sha="$(gh api "repos/${UPSTREAM}/commits/${tag}" --jq .sha)"
          # Upstream releases from its main line; a tag made elsewhere is left
          # for a person to judge.
          if [[ "$(gh api "repos/${UPSTREAM}/compare/${sha}...main" --jq .status)" != @(ahead|identical) ]]; then
            echo "Upstream ${tag} (${sha}) is not on upstream's main; mirror it by hand if intended" >&2
            exit 1
          fi

          {
            echo "build=true"
            echo "source_ref=${sha}"
            echo "release_tag=upstream-${tag}"
            echo "version_tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Mirroring upstream ${tag} (${sha}) as upstream-${tag}"

  release:
    name: Release
    needs: find
    if: needs.find.outputs.build == 'true'
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation through Sigstore
      attestations: write # store the attestation against the repository
    uses: ./.github/workflows/release.yml
    with:
      source_repository: osodevops/ms-teams-cli
      source_ref: ${{ needs.find.outputs.source_ref }}
      release_tag: ${{ needs.find.outputs.release_tag }}
      version_tag: ${{ needs.find.outputs.version_tag }}
