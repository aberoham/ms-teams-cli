name: Release

on:
  push:
    tags: ["v*"]
  # mirror-upstream.yml calls this to build an upstream release.
  workflow_call:
    inputs:
      source_ref:
        description: Commit to build, the one upstream tagged
        type: string
        required: true
      release_tag:
        description: Tag of the release this run creates, upstream-vX.Y.Z
        type: string
        required: true
      version_tag:
        description: Upstream's tag, vX.Y.Z, which names the archives
        type: string
        required: true

# A tag push builds the tagged commit and releases it under that tag. A call
# from mirror-upstream.yml builds upstream's commit and releases it under an
# upstream- tag, with archives named after upstream's version.
env:
  CARGO_TERM_COLOR: always
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
  MIRROR: ${{ inputs.release_tag && 'true' || 'false' }}

permissions:
  contents: read

# Never cancel a release half way; a second run for the same tag waits.
concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      # A fork publishes its own work only as prereleases: a plain vX.Y.Z tag
      # on the fork would sort as upstream's stable release of the same number
      # and be installed in its place. Upstream's stable releases are mirrored
      # under upstream-vX.Y.Z instead, built from upstream's own commit.
      - name: Check tag against the package version
        env:
          UPSTREAM: ${{ github.repository == 'osodevops/ms-teams-cli' }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$VERSION_TAG" != "v${package_version}" ]]; then
            echo "Tag ${VERSION_TAG} does not match Cargo.toml version ${package_version}" >&2
            exit 1
          fi
          if [[ "$MIRROR" == true ]]; then
            if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "upstream-${VERSION_TAG}" ]]; then
              echo "A mirror publishes upstream-vX.Y.Z for upstream's vX.Y.Z; got ${RELEASE_TAG} for ${VERSION_TAG}" >&2
              exit 1
            fi
          # The personal tap accepts only these forms, which Homebrew and
          # RubyGems order identically.
          elif [[ "$UPSTREAM" != true && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Forks publish only vX.Y.Z-alpha.N, -beta.N or -rc.N; got ${RELEASE_TAG}" >&2
            exit 1
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.source_ref }}

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-tag, ci]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          package="teams-${VERSION_TAG}-${{ matrix.target }}"
          mkdir -p "dist/${package}/bin" "dist/${package}/share/doc" "dist/${package}/share/man/man1" "dist/${package}/share/man/man5" "dist/${package}/share/man/man7"
          cp "target/${{ matrix.target }}/release/teams" "dist/${package}/bin/teams"
          cp docs/man/teams.1 "dist/${package}/share/man/man1/teams.1"
          cp docs/man/teams-config.5 "dist/${package}/share/man/man5/teams-config.5"
          cp docs/man/teams-auth.7 "dist/${package}/share/man/man7/teams-auth.7"
          cp docs/man/teams-agent-contract.7 "dist/${package}/share/man/man7/teams-agent-contract.7"
          cp docs/man/teams-examples.7 "dist/${package}/share/man/man7/teams-examples.7"
          cp -R docs "dist/${package}/share/doc/teams"
          cp README.md CHANGELOG.md LICENSE SECURITY.md "dist/${package}/share/doc/teams/"
          tar czf "${package}.tar.gz" -C dist "${package}"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $package = "teams-$env:VERSION_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$package/bin", "dist/$package/share/doc", "dist/$package/share/man/man1", "dist/$package/share/man/man5", "dist/$package/share/man/man7"
          Copy-Item "target/${{ matrix.target }}/release/teams.exe" "dist/$package/bin/teams.exe"
          Copy-Item "docs/man/teams.1" "dist/$package/share/man/man1/teams.1"
          Copy-Item "docs/man/teams-config.5" "dist/$package/share/man/man5/teams-config.5"
          Copy-Item "docs/man/teams-auth.7" "dist/$package/share/man/man7/teams-auth.7"
          Copy-Item "docs/man/teams-agent-contract.7" "dist/$package/share/man/man7/teams-agent-contract.7"
          Copy-Item "docs/man/teams-examples.7" "dist/$package/share/man/man7/teams-examples.7"
          Copy-Item -Recurse "docs" "dist/$package/share/doc/teams"
          Copy-Item -Path @("README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md") -Destination "dist/$package/share/doc/teams/"
          Compress-Archive -Path "dist/$package" -DestinationPath "$package.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teams-${{ matrix.target }}
          path: teams-${{ env.VERSION_TAG }}-${{ matrix.target }}.*

  sign-macos:
    name: Sign macOS ${{ matrix.target }}
    needs: build
    runs-on: macos-latest
    # Defense in depth; the environment reviewer and tag ruleset are the boundary.
    if: github.repository_owner_id == 586805 && github.actor == 'aberoham' && github.triggering_actor == 'aberoham'
    environment: release
    # One notarization wait of up to 45 minutes per architecture.
    timeout-minutes: 60
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teams-${{ matrix.target }}
      - name: Prepare signing identity
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: python3 .github/scripts/macos-signing.py prepare
      - name: Sign, notarize and verify the packaged binary
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          package="teams-${VERSION_TAG}-${TARGET}"
          unpacked="$RUNNER_TEMP/signed-package"
          mkdir -p "$unpacked"
          tar xzf "${package}.tar.gz" -C "$unpacked"
          python3 .github/scripts/macos-signing.py sign "$unpacked/$package/bin/teams" com.aberoham.teams-cli --notarize
          tar czf "${package}.tar.gz" -C "$unpacked" "$package"
      - name: Replace the unsigned artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teams-${{ matrix.target }}
          path: teams-${{ env.VERSION_TAG }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          overwrite: true
      - name: Remove signing credentials
        if: always()
        run: python3 .github/scripts/macos-signing.py cleanup

  release:
    name: Create Release
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation through Sigstore
      attestations: write # store the attestation against the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum teams-* > checksums-sha256.txt
          cat checksums-sha256.txt

      # Attests the archives as published, after the macOS ones were signed,
      # so `gh attestation verify` ties each download to this workflow run.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/checksums-sha256.txt

      # A mirror creates its upstream- tag here, on upstream's commit, and
      # points at upstream's notes rather than generating its own.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_REF }}
          generate_release_notes: ${{ env.MIRROR != 'true' }}
          body: ${{ env.MIRROR == 'true' && format('Signed, notarized and attested build of [osodevops/ms-teams-cli {0}](https://github.com/osodevops/ms-teams-cli/releases/tag/{0}), from the same commit.', env.VERSION_TAG) || '' }}
          prerelease: ${{ contains(env.VERSION_TAG, '-') }}
          files: |
            artifacts/teams-*
            artifacts/checksums-sha256.txt

  homebrew:
    name: Update Homebrew Tap
    needs: release
    # The personal tap reads fork releases itself, so the fork holds no
    # credential for it.
    if: github.repository == 'osodevops/ms-teams-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {}
    steps:
      - name: Update homebrew formula
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: osodevops/homebrew-tap
          event-type: update-formula
          client-payload: |
            {
              "formula": "teams-cli",
              "tag": "${{ github.ref_name }}",
              "repo": "${{ github.repository }}"
            }

      - name: Verify homebrew formula was published
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          checksums_file="$(mktemp)"
          trap 'rm -f "$checksums_file"' EXIT
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/checksums-sha256.txt" \
            --output "$checksums_file"

          targets=(
            aarch64-apple-darwin
            x86_64-apple-darwin
            aarch64-unknown-linux-musl
            x86_64-unknown-linux-musl
          )

          for attempt in $(seq 1 30); do
            formula="$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github.raw+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/osodevops/homebrew-tap/contents/Formula/teams-cli.rb?ref=main"
            )" || formula=""

            published=true
            for target in "${targets[@]}"; do
              asset="teams-${RELEASE_TAG}-${target}.tar.gz"
              checksum="$(awk -v asset="$asset" '$2 == asset { print $1 }' "$checksums_file")"
              if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Release checksums are missing a valid SHA-256 for ${asset}" >&2
                exit 1
              fi

              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
              if ! grep -Fq "$url" <<<"$formula" ||
                ! grep -Fq "sha256 \"${checksum}\"" <<<"$formula"; then
                published=false
                break
              fi
            done

            if [[ "$published" == true ]]; then
              echo "Homebrew formula publishes ${RELEASE_TAG} with all expected checksums"
              exit 0
            fi

            echo "Waiting for the Homebrew tap to publish ${RELEASE_TAG} (attempt ${attempt}/30)"
            sleep 10
          done

          echo "Homebrew tap did not publish ${RELEASE_TAG} within five minutes" >&2
          echo "Check https://github.com/osodevops/homebrew-tap/actions" >&2
          exit 1

  publish-scoop-manifest:
    name: Publish Scoop Manifest
    needs: release
    if: github.repository == 'osodevops/ms-teams-cli'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Scoop bucket update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          repository: osodevops/scoop-bucket
          event-type: update-teams-manifest
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "tag": "${{ github.ref_name }}"}'

  notify-docs:
    name: Notify Documentation Site
    needs: release
    if: github.repository == 'osodevops/ms-teams-cli'
    runs-on: ubuntu-latest
    permissions: {}
    # Never fail a published release over a docs notification. The docs repo also
    # regenerates on a weekly schedule, so a missed dispatch delays the reference
    # rather than losing it.
    continue-on-error: true
    steps:
      # ms-teams-cli-docs regenerates reference/command/** from `teams --help-json`
      # on the released binary, and its sidebar version badge is resolved at build
      # time. Without this dispatch neither ever fires on a release: the docs repo
      # listens for `cli-released` and nothing was sending it.
      - name: Trigger docs regeneration and redeploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          # Prefers a purpose-scoped secret; falls back to the token already used
          # to dispatch across org repositories so this works before one is added.
          token: ${{ secrets.DOCS_DISPATCH_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          repository: osodevops/ms-teams-cli-docs
          event-type: cli-released
          client-payload: '{"tag": "${{ github.ref_name }}", "repo": "${{ github.repository }}"}'
